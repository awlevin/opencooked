<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overcooked Party — Host</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------------------------------------------------------------
         Overcooked Party — host / TV view.
         Warm cartoon kitchen: cream card stock, thick cocoa outlines,
         butter-yellow accents. Nothing here should look like browser UI.
         --------------------------------------------------------------- */
      :root {
        --ink: #3b2314;
        --ink-soft: #6b4526;
        --cream: #fff6e3;
        --cream-2: #ffeac2;
        --butter: #ffd23f;
        --tomato: #e8503a;
        --mint: #2ec4a0;
        --wood: #b8763c;
        --font: 'Baloo 2', 'Fredoka', 'Trebuchet MS', 'Avenir Next Rounded',
          system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c110a;
        font-family: var(--font);
        color: var(--cream);
        -webkit-font-smoothing: antialiased;
      }

      body[data-screen='playing'] {
        cursor: none;
      }

      #root {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }

      /* Warm kitchen backdrop shared by the DOM screens. */
      .backdrop {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            120% 80% at 50% -10%,
            #7a3f1c 0%,
            #4a2412 45%,
            #23140c 100%
          );
      }
      .backdrop::after {
        content: '';
        position: absolute;
        inset: -10%;
        background: repeating-linear-gradient(
          -45deg,
          rgba(255, 226, 168, 0.045) 0 22px,
          rgba(0, 0, 0, 0) 22px 64px
        );
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.4;
        animation: drift 18s ease-in-out infinite;
      }
      .blob.b1 {
        width: 46vmin;
        height: 46vmin;
        left: -8vmin;
        top: 8vmin;
        background: #ff9b3d;
      }
      .blob.b2 {
        width: 40vmin;
        height: 40vmin;
        right: -6vmin;
        bottom: -6vmin;
        background: #e8503a;
        animation-delay: -7s;
      }
      .blob.b3 {
        width: 30vmin;
        height: 30vmin;
        right: 18vmin;
        top: -8vmin;
        background: #ffd23f;
        opacity: 0.25;
        animation-delay: -12s;
      }
      @keyframes drift {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(4vmin, 5vmin, 0) scale(1.12);
        }
      }

      /* --- screens --- */
      .screen {
        position: absolute;
        inset: 0;
        display: none;
      }
      body[data-screen='lobby'] #lobby,
      body[data-screen='playing'] #play,
      body[data-screen='gameover'] #over {
        display: block;
      }

      .stack {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(18px, 3.2vh, 44px) clamp(20px, 3vw, 64px);
        gap: clamp(16px, 3vh, 46px);
      }

      /* --- title --- */
      .title {
        text-align: center;
        line-height: 0.92;
      }
      .kicker {
        font-size: clamp(16px, 1.9vw, 48px);
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--cream-2);
        opacity: 0.8;
        margin-bottom: 0.35em;
      }
      .title h1 {
        margin: 0;
        font-size: clamp(44px, 6.4vw, 190px);
        font-weight: 800;
        letter-spacing: 0.01em;
        color: var(--cream);
        -webkit-text-stroke: 0.09em var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 0.09em 0 rgba(59, 35, 20, 0.55);
      }
      .title h1 .hot {
        color: var(--butter);
      }
      .title .sub {
        display: inline-block;
        margin-top: 0.15em;
        padding: 0.06em 0.7em 0.14em;
        font-size: clamp(20px, 2.6vw, 74px);
        font-weight: 800;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        color: #2a1710;
        background: var(--butter);
        border: 0.09em solid var(--ink);
        border-radius: 999px;
        transform: rotate(-1.6deg);
        box-shadow: 0 0.14em 0 rgba(59, 35, 20, 0.5);
      }

      /* --- join panels --- */
      .join {
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: clamp(16px, 2.6vw, 48px);
      }
      .card {
        background: var(--cream);
        color: var(--ink);
        border: 0.28vmin solid var(--ink);
        border-radius: clamp(16px, 2vw, 34px);
        box-shadow: 0 1.1vmin 0 rgba(29, 16, 9, 0.55);
        padding: clamp(12px, 1.5vh, 26px) clamp(16px, 1.8vw, 34px)
          clamp(14px, 1.7vh, 28px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      .card-label {
        font-size: clamp(14px, 1.35vw, 38px);
        font-weight: 700;
        letter-spacing: 0.26em;
        text-indent: 0.26em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .code-card {
        transform: rotate(-1.6deg);
        background: linear-gradient(180deg, #fffaf0, #ffe9c4);
      }
      .code {
        font-size: clamp(56px, 8.2vw, 240px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.06em;
        text-indent: 0.06em;
        color: var(--ink);
        font-variant-ligatures: none;
      }
      .code.pending {
        color: rgba(59, 35, 20, 0.28);
      }
      .qr-card {
        transform: rotate(1.4deg);
        gap: clamp(6px, 0.9vh, 14px);
      }
      .qr-frame {
        background: #fff;
        border: 0.22vmin solid var(--ink);
        border-radius: clamp(8px, 1vw, 16px);
        padding: clamp(6px, 0.9vh, 14px);
        line-height: 0;
      }
      .qr-frame canvas {
        display: block;
        width: clamp(160px, 24vh, 460px);
        height: clamp(160px, 24vh, 460px);
        border-radius: 4px;
      }
      .join-url {
        max-width: min(46vw, 900px);
        font-size: clamp(14px, 1.3vw, 38px);
        font-weight: 600;
        color: var(--ink-soft);
        word-break: break-all;
        text-align: center;
        line-height: 1.15;
      }

      .instruction {
        margin: 0;
        font-size: clamp(18px, 2.25vw, 62px);
        font-weight: 600;
        color: var(--cream-2);
        text-align: center;
        text-shadow: 0 0.08em 0 rgba(29, 16, 9, 0.6);
      }
      .instruction b {
        color: var(--butter);
        font-weight: 800;
        padding: 0 0.12em;
      }

      /* --- chef roster --- */
      .roster {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: clamp(8px, 1vw, 20px);
        min-height: clamp(48px, 8vh, 104px);
      }
      .chef {
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.22em 0.85em 0.28em 0.35em;
        background: var(--cream);
        border: 0.24vmin solid var(--ink);
        border-radius: 999px;
        box-shadow: 0 0.7vmin 0 rgba(29, 16, 9, 0.5);
        color: var(--ink);
        font-size: clamp(17px, 1.85vw, 54px);
        font-weight: 700;
        animation: pop 0.42s cubic-bezier(0.2, 1.5, 0.4, 1) both;
      }
      .chef .dot {
        width: 1.24em;
        height: 1.24em;
        border-radius: 50%;
        border: 0.1em solid var(--ink);
        background: linear-gradient(
          180deg,
          #fff 0 36%,
          var(--c, #e74c3c) 36% 100%
        );
        box-shadow: inset 0 -0.16em 0 rgba(0, 0, 0, 0.18);
        flex: none;
      }
      .chef .nm {
        max-width: 7em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .roster .waiting {
        font-size: clamp(16px, 1.7vw, 46px);
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 234, 194, 0.55);
        animation: breathe 2.2s ease-in-out infinite;
      }
      @keyframes pop {
        from {
          transform: scale(0.4) rotate(-8deg);
          opacity: 0;
        }
        to {
          transform: scale(1) rotate(0);
          opacity: 1;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 0.9;
        }
      }

      /* --- play --- */
      #play {
        background: #1c110a;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* --- gameover --- */
      #over .stack {
        justify-content: center;
        gap: clamp(8px, 1.8vh, 26px);
      }
      .stars {
        display: flex;
        gap: clamp(8px, 1.4vw, 26px);
      }
      .stars svg {
        width: clamp(96px, 15vw, 380px);
        height: auto;
        animation: starIn 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) both;
      }
      .stars svg:nth-child(2) {
        animation-delay: 0.14s;
      }
      .stars svg:nth-child(3) {
        animation-delay: 0.28s;
      }
      .stars .fill {
        fill: #4a2c18;
        stroke: var(--ink);
        stroke-width: 10;
        stroke-linejoin: round;
      }
      .stars .on .fill {
        fill: var(--butter);
        filter: drop-shadow(0 0 18px rgba(255, 210, 63, 0.75));
      }
      .final-score {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 0.9;
      }
      .final-score .n {
        font-size: clamp(84px, 15vw, 400px);
        font-weight: 800;
        color: var(--cream);
        -webkit-text-stroke: 0.055em var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 0.07em 0 rgba(29, 16, 9, 0.55);
      }
      .tallies {
        display: flex;
        gap: clamp(12px, 2vw, 40px);
      }
      .tally {
        display: flex;
        align-items: baseline;
        gap: 0.4em;
        padding: 0.1em 0.85em 0.2em;
        background: var(--cream);
        border: 0.24vmin solid var(--ink);
        border-radius: 999px;
        box-shadow: 0 0.7vmin 0 rgba(29, 16, 9, 0.5);
        font-size: clamp(20px, 2.4vw, 68px);
        font-weight: 800;
      }
      .tally .n {
        font-size: 1.5em;
      }
      .tally em {
        font-style: normal;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.62em;
        color: var(--ink-soft);
      }
      .tally.good .n {
        color: #1f9e6f;
      }
      .tally.bad .n {
        color: var(--tomato);
      }
      .verdict {
        font-size: clamp(22px, 3.1vw, 88px);
        font-weight: 800;
        color: var(--butter);
        text-shadow: 0 0.08em 0 rgba(29, 16, 9, 0.6);
      }

      /* --- connection pill --- */
      /* Sits bottom-centre so it never covers the order tickets. */
      .conn {
        position: absolute;
        bottom: clamp(10px, 1.4vh, 24px);
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 0.5em;
        padding: 0.24em 0.9em 0.3em;
        background: rgba(28, 17, 10, 0.86);
        border: 0.2vmin solid var(--butter);
        border-radius: 999px;
        color: var(--cream-2);
        font-size: clamp(14px, 1.35vw, 30px);
        font-weight: 700;
        letter-spacing: 0.08em;
        z-index: 5;
      }
      .conn.show {
        display: flex;
      }
      .conn .dot {
        width: 0.62em;
        height: 0.62em;
        border-radius: 50%;
        background: var(--butter);
        animation: breathe 1.1s ease-in-out infinite;
      }
    </style>
  </head>
  <body data-screen="lobby">
    <div id="root">
      <section id="lobby" class="screen">
        <div class="backdrop">
          <div class="blob b1"></div>
          <div class="blob b2"></div>
          <div class="blob b3"></div>
        </div>
        <div class="stack">
          <header class="title">
            <div class="kicker">Get your aprons on</div>
            <h1>OVER<span class="hot">COOKED</span></h1>
            <div class="sub">PARTY</div>
          </header>

          <div class="join">
            <div class="card code-card">
              <div class="card-label">Room code</div>
              <div id="roomCode" class="code pending">····</div>
            </div>
            <div class="card qr-card">
              <div class="card-label">Scan to play</div>
              <div class="qr-frame"><canvas id="qr" width="8" height="8"></canvas></div>
              <div id="joinUrl" class="join-url">connecting…</div>
            </div>
          </div>

          <p class="instruction">
            Scan to join — any chef presses <b>Start</b>
          </p>

          <div id="roster" class="roster"></div>
        </div>
      </section>

      <section id="play" class="screen"><canvas id="stage"></canvas></section>

      <section id="over" class="screen">
        <div class="backdrop">
          <div class="blob b1"></div>
          <div class="blob b2"></div>
        </div>
        <div class="stack">
          <div class="kicker">Service is over</div>
          <div id="stars" class="stars"></div>
          <div class="final-score">
            <div class="card-label" style="color: var(--cream-2); opacity: 0.75">
              Final score
            </div>
            <div id="finalScore" class="n">0</div>
          </div>
          <div class="tallies">
            <div class="tally good">
              <span id="finalServed" class="n">0</span><em>served</em>
            </div>
            <div class="tally bad">
              <span id="finalMissed" class="n">0</span><em>missed</em>
            </div>
          </div>
          <div id="verdict" class="verdict">Nice shift, chefs.</div>
          <p class="instruction">Any chef can press <b>Play Again</b></p>
        </div>
      </section>

      <div id="conn" class="conn"><span class="dot"></span><span id="connMsg">Reconnecting…</span></div>
    </div>
    <script type="module" src="/src/host/main.ts"></script>
  </body>
</html>
